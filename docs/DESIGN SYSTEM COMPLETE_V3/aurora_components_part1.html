<div style="background:#F8F9FC;padding:28px;font-family:'Segoe UI',system-ui,sans-serif;">

<div style="font-size:12px;font-weight:600;color:#94A3B8;margin-bottom:10px;">Buttons</div>
<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;">
  <button style="height:40px;padding:0 20px;background:#4F46E5;color:#fff;border:none;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(79,70,229,0.28);">Create event</button>
  <button style="height:40px;padding:0 20px;background:#fff;color:#334155;border:1px solid #E2E8F0;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;">Cancel</button>
  <button style="height:40px;padding:0 20px;background:transparent;color:#475569;border:none;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;">Skip for now</button>
  <button style="height:40px;padding:0 20px;background:#DC2626;color:#fff;border:none;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;">Delete workspace</button>
</div>

<div style="font-size:12px;font-weight:600;color:#94A3B8;margin-bottom:10px;">Status pills &amp; avatars</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:28px;">
  <span style="display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;background:#ECFDF5;color:#059669;font-size:11.5px;font-weight:600;"><span style="width:6px;height:6px;border-radius:50%;background:#10B981;"></span>Active</span>
  <span style="display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;background:#FFFBEB;color:#B45309;font-size:11.5px;font-weight:600;"><span style="width:6px;height:6px;border-radius:50%;background:#F59E0B;"></span>Pending</span>
  <span style="display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;background:#FEF2F2;color:#DC2626;font-size:11.5px;font-weight:600;"><span style="width:6px;height:6px;border-radius:50%;background:#EF4444;"></span>Declined</span>
  <span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:rgba(139,92,246,0.1);color:#7C3AED;font-size:11.5px;font-weight:600;">Speaker</span>
  <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FCA5A5,#EF4444);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:600;">RN</div>
  <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6EE7B7,#059669);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:600;">JD</div>
  <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#818CF8,#4F46E5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:600;position:relative;">MK
    <span style="position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:#10B981;border:2px solid #F8F9FC;"></span>
  </div>
</div>

<div style="font-size:12px;font-weight:600;color:#94A3B8;margin-bottom:10px;">Stat cards</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;">
  <div style="background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.05);padding:20px;">
    <div style="font-size:11.5px;font-weight:600;color:#94A3B8;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;">Registered</div>
    <div style="display:flex;align-items:baseline;gap:8px;">
      <div style="font-size:26px;font-weight:700;color:#0F172A;letter-spacing:-0.02em;">248</div>
      <span style="font-size:11.5px;font-weight:600;color:#059669;background:#ECFDF5;padding:2px 7px;border-radius:999px;">+12%</span>
    </div>
  </div>
  <div style="background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.05);padding:20px;">
    <div style="font-size:11.5px;font-weight:600;color:#94A3B8;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;">Checked in</div>
    <div style="display:flex;align-items:baseline;gap:8px;">
      <div style="font-size:26px;font-weight:700;color:#0F172A;letter-spacing:-0.02em;">96</div>
      <span style="font-size:11.5px;font-weight:600;color:#94A3B8;">of 248</span>
    </div>
  </div>
  <div style="background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.05);padding:20px;">
    <div style="font-size:11.5px;font-weight:600;color:#94A3B8;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;">Pending</div>
    <div style="display:flex;align-items:baseline;gap:8px;">
      <div style="font-size:26px;font-weight:700;color:#0F172A;letter-spacing:-0.02em;">14</div>
      <span style="font-size:11.5px;font-weight:600;color:#B45309;background:#FFFBEB;padding:2px 7px;border-radius:999px;">-3%</span>
    </div>
  </div>
</div>

<div style="font-size:12px;font-weight:600;color:#94A3B8;margin-bottom:10px;">Card with progress</div>
<div style="background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.05);padding:24px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
    <div style="font-size:16px;font-weight:700;color:#0F172A;letter-spacing:-0.01em;">Africa Mining Indaba setup</div>
    <span style="font-size:12.5px;font-weight:600;color:#4F46E5;">7 of 15 complete</span>
  </div>
  <div style="font-size:13px;color:#94A3B8;margin-bottom:14px;">Finish these steps before publishing your event.</div>
  <div style="width:100%;height:8px;background:#F1F5F9;border-radius:999px;overflow:hidden;">
    <div style="width:47%;height:100%;background:#4F46E5;border-radius:999px;"></div>
  </div>
</div>

</div>
