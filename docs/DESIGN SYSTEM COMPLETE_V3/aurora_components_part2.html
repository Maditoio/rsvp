<div style="background:#F8F9FC;padding:28px;font-family:'Segoe UI',system-ui,sans-serif;">

<div style="font-size:12px;font-weight:600;color:#94A3B8;margin-bottom:10px;">Form fields</div>
<div style="background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.05);padding:24px;display:flex;flex-direction:column;gap:18px;margin-bottom:28px;">
  <div>
    <div style="font-size:12px;font-weight:600;color:#334155;margin-bottom:6px;">Search attendees</div>
    <div style="position:relative;max-width:320px;">
      <i class="ti ti-search" style="position:absolute;left:14px;top:12px;font-size:16px;color:#94A3B8;" aria-hidden="true"></i>
      <input type="text" placeholder="Search by name or email" style="width:100%;box-sizing:border-box;height:40px;padding:0 14px 0 38px;border:1px solid #E2E8F0;border-radius:999px;font-size:13.5px;color:#0F172A;background:#F8FAFC;" />
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#334155;">
      <span style="width:18px;height:18px;border-radius:6px;background:#4F46E5;display:inline-flex;align-items:center;justify-content:center;"><i class="ti ti-check" style="font-size:12px;color:#fff;" aria-hidden="true"></i></span>
      Send confirmation email
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#334155;">
      <span style="width:18px;height:18px;border-radius:50%;border:1.5px solid #CBD5E1;"></span>
      Require approval
    </label>
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:38px;height:22px;border-radius:999px;background:#4F46E5;position:relative;"><div style="width:17px;height:17px;border-radius:50%;background:#fff;position:absolute;top:2.5px;right:2.5px;box-shadow:0 1px 2px rgba(0,0,0,0.15);"></div></div>
      <span style="font-size:13px;color:#334155;">Waitlist enabled</span>
    </div>
  </div>
  <div style="display:inline-flex;background:#F1F5F9;border-radius:999px;padding:3px;width:fit-content;">
    <div style="padding:7px 18px;background:#fff;border-radius:999px;font-size:12.5px;font-weight:600;color:#0F172A;box-shadow:0 1px 2px rgba(15,23,42,0.06);">In person</div>
    <div style="padding:7px 18px;border-radius:999px;font-size:12.5px;color:#64748B;">Virtual</div>
    <div style="padding:7px 18px;border-radius:999px;font-size:12.5px;color:#64748B;">Hybrid</div>
  </div>
</div>

<div style="display:flex;gap:20px;flex-wrap:wrap;">

  <div>
    <div style="font-size:12px;font-weight:600;color:#94A3B8;margin-bottom:10px;">Dropdown menu</div>
    <div style="background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 12px 32px rgba(15,23,42,0.06);padding:6px;width:220px;">
      <div style="font-size:10.5px;font-weight:600;letter-spacing:0.04em;color:#94A3B8;padding:6px 10px 4px;text-transform:uppercase;">Change role</div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;background:#EEF2FF;">
        <span style="font-size:13px;color:#4338CA;font-weight:600;">Admin</span>
        <i class="ti ti-check" style="font-size:14px;color:#4F46E5;" aria-hidden="true"></i>
      </div>
      <div style="padding:8px 10px;border-radius:8px;font-size:13px;color:#334155;">Member</div>
      <div style="height:1px;background:#F1F5F9;margin:5px 4px;"></div>
      <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:#DC2626;">
        <i class="ti ti-trash" style="font-size:14px;" aria-hidden="true"></i>
        <span style="font-size:13px;">Remove member</span>
      </div>
    </div>
  </div>

  <div>
    <div style="font-size:12px;font-weight:600;color:#94A3B8;margin-bottom:10px;">Calendar</div>
    <div style="background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 12px 32px rgba(15,23,42,0.06);padding:16px;width:260px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <i class="ti ti-chevron-left" style="font-size:15px;color:#94A3B8;" aria-hidden="true"></i>
        <span style="font-size:13.5px;font-weight:600;color:#0F172A;">August 2026</span>
        <i class="ti ti-chevron-right" style="font-size:15px;color:#94A3B8;" aria-hidden="true"></i>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">
        <div style="font-size:10.5px;color:#94A3B8;padding:4px 0;">S</div><div style="font-size:10.5px;color:#94A3B8;padding:4px 0;">M</div><div style="font-size:10.5px;color:#94A3B8;padding:4px 0;">T</div><div style="font-size:10.5px;color:#94A3B8;padding:4px 0;">W</div><div style="font-size:10.5px;color:#94A3B8;padding:4px 0;">T</div><div style="font-size:10.5px;color:#94A3B8;padding:4px 0;">F</div><div style="font-size:10.5px;color:#94A3B8;padding:4px 0;">S</div>
        <div></div><div></div><div></div><div></div><div></div><div></div>
        <div style="font-size:12.5px;color:#334155;padding:6px 0;">1</div>
        <div style="font-size:12.5px;color:#334155;padding:6px 0;">2</div>
        <div style="font-size:12.5px;color:#334155;padding:6px 0;">3</div>
        <div style="font-size:12.5px;color:#334155;padding:6px 0;">4</div>
        <div style="font-size:12.5px;color:#fff;background:#818CF8;border-radius:50%;padding:6px 0;">5</div>
        <div style="font-size:12.5px;color:#fff;background:#818CF8;border-radius:50%;padding:6px 0;">6</div>
        <div style="font-size:12.5px;color:#fff;background:#4F46E5;border-radius:50%;padding:6px 0;box-shadow:0 2px 6px rgba(79,70,229,0.35);">7</div>
        <div style="font-size:12.5px;color:#334155;padding:6px 0;">8</div>
        <div style="font-size:12.5px;color:#334155;padding:6px 0;">9</div>
        <div style="font-size:12.5px;color:#334155;padding:6px 0;">10</div>
      </div>
    </div>
  </div>

</div>

</div>
