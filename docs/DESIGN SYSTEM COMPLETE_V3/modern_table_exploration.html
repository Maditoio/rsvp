<div style="background:#F8F9FC;padding:32px;font-family:'Segoe UI',system-ui,sans-serif;">

<div style="background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 12px 32px rgba(15,23,42,0.06);overflow:hidden;max-width:920px;">

  <div style="padding:24px 28px 20px;display:flex;align-items:center;justify-content:space-between;">

        <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#818CF8,#4F46E5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:600;">MK</div>
        <div>
          <div style="font-size:13.5px;font-weight:600;color:#0F172A;">Mumba Kasai</div>

        </div>
      </div>
      <div style="font-size:13px;color:#475569;">Owner</div>
      <div>
        <span style="display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;background:#ECFDF5;color:#059669;font-size:11.5px;font-weight:600;">
          <span style="width:6px;height:6px;border-radius:50%;background:#10B981;"></span> Active
        </span>

      <div style="display:flex;justify-content:flex-end;">
        <div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;">

        </div>
      </div>
    </div>

        <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FCA5A5,#EF4444);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:600;">RN</div>

        <div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <i class="ti ti-dots" style="font-size:17px;color:#94A3B8;" aria-hidden="true"></i>
        </div>

        </div>

      <div style="font-size:13px;color:#475569;">Member</div>
